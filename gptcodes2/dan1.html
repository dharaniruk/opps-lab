<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD Books – Spider-Verse Comic Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Boogaloo&family=Rajdhani:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8001C;
    --blue: #1565C0;
    --yellow: #FFD700;
    --white: #F5F5F5;
    --black: #0A0A0A;
    --dark: #111;
    --mid: #1a1a1a;
    --glow-red: rgba(232, 0, 28, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background-color: var(--black);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  /* Grid Background Effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER & LOGO */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px 25px;
    background: linear-gradient(180deg, #1a0000 0%, var(--black) 100%);
    border-bottom: 3px solid var(--red);
  }

  .logo {
    font-family: 'Boogaloo', cursive;
    font-size: clamp(4rem, 10vw, 7rem);
    color: var(--red);
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 15px var(--glow-red);
    animation: flicker 4s infinite alternate, pulse-glow 3s infinite ease-in-out;
  }

  @keyframes flicker {
    0%,95%{opacity:1}96%{opacity:.85}97%{opacity:1}98%{opacity:.9}100%{opacity:1}
  }
  @keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 10px var(--glow-red); }
    50% { text-shadow: 0 0 30px var(--red); }
  }

  /* ACCOUNT WIDGET */
  .account-widget { position: absolute; top: 18px; right: 20px; z-index: 50; }
  .account-btn {
    display: flex; align-items: center; gap: 9px;
    background: rgba(10,10,10,0.85);
    border: 1.5px solid var(--red);
    padding: 7px 14px 7px 8px;
    cursor: pointer;
    clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    transition: all 0.2s;
  }
  .account-btn:hover { background: rgba(232,0,28,0.15); border-color: var(--yellow); }
  .account-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--red); display: flex; align-items: center; justify-content: center;
    font-family: 'Bangers', cursive; color: #fff; border: 1.5px solid var(--yellow);
  }

  /* NAVIGATION */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,10,0.92); backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--blue);
    display: flex; justify-content: center; gap: 12px;
    padding: 12px 20px;
  }
  .nav-btn {
    font-family: 'Rajdhani', sans-serif; font-weight: 700;
    font-size: 0.95rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--white); background: transparent;
    border: 1px solid rgba(255,255,255,0.1); padding: 9px 22px;
    cursor: pointer; transition: all 0.3s;
    clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  }
  .nav-btn:hover, .nav-btn.active {
    background: var(--red); border-color: var(--red);
    box-shadow: 0 0 20px rgba(232,0,28,0.4);
  }

  /* SEARCH SECTION */
  .search-wrap {
    display: flex; justify-content: center;
    padding: 30px 20px; position: relative; z-index: 2;
  }
  .search-inner {
    display: flex; width: 100%; max-width: 600px;
    border: 2px solid var(--blue); background: var(--mid);
    clip-path: polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
  }
  .search-inner input {
    flex: 1; background: transparent; border: none; outline: none;
    padding: 15px 20px; font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem; color: var(--white);
  }
  .search-inner button {
    background: var(--blue); border: none; padding: 0 30px; color: #fff;
    font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer;
    transition: background 0.2s;
  }

  /* COMIC GRID */
  .featured { padding: 60px 20px; background: var(--black); }
  .section-title {
    font-family: 'Bangers', cursive; font-size: 3.5rem;
    color: var(--yellow); text-align: center; margin-bottom: 40px;
    text-shadow: 3px 3px 0 var(--red);
  }
  .comics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 30px; max-width: 1200px; margin: 0 auto;
  }

  /* COMIC CARD - MARVEL STYLE */
  .comic-card {
    background: #151515; border: 1px solid #222;
    text-decoration: none; display: block;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: fadeIn 0.5s ease forwards;
    position: relative;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .comic-card:hover {
    transform: translateY(-10px) scale(1.02);
    border-color: var(--red);
    box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 15px var(--glow-red);
    z-index: 5;
  }
  .comic-cover-placeholder {
    width: 100%; aspect-ratio: 2/3; position: relative; overflow: hidden;
  }
  .comic-info { padding: 15px; }
  .comic-issue { color: var(--red); font-weight: 700; font-size: 0.8rem; margin-bottom: 5px; }
  .comic-title { font-family: 'Bangers'; font-size: 1.4rem; color: #fff; margin-bottom: 8px; }
  .comic-desc { font-size: 0.85rem; color: #888; line-height: 1.4; }

  /* BADGES */
  .comic-badge {
    position: absolute; top: 10px; left: 10px;
    padding: 4px 12px; font-family: 'Bangers'; font-size: 0.9rem;
    color: #fff; z-index: 2;
    clip-path: polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);
  }
  .new { background: var(--yellow); color: #000; }
  .hot { background: #ff4500; }
  .classic { background: #7b2ff7; }

  /* FOOTER */
  footer { padding: 40px; text-align: center; border-top: 1px solid #222; margin-top: 50px; }
  footer p { color: #444; letter-spacing: 2px; text-transform: uppercase; font-size: 0.8rem; }
  footer span { color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">DD BOOKS</div>
  <div class="tagline">Spider-Verse Archive</div>
  <div class="account-widget" id="accountWidget"></div>
</header>

<nav>
  <button class="nav-btn active">Home</button>
  <button class="nav-btn">Collections</button>
  <button class="nav-btn">New Releases</button>
  <button class="nav-btn">About</button>
</nav>

<div class="search-wrap">
  <div class="search-inner">
    <input type="text" id="comicSearch" placeholder="Search the Multiverse (Miles, Gwen, 2099...)" oninput="filterComics()">
    <button>SEARCH</button>
  </div>
</div>

<section class="featured">
  <div class="section-title">All Comics</div>
  <div class="comics-grid" id="comicGrid"></div>
</section>

<footer>
  <p>© 2026 <span>DD Books</span> — Marvel Fan Project</p>
</footer>

<script>
  // 1. DATA: THE COMIC DATABASE
  const comicDatabase = [
    { title: "Amazing Spider-Man", issue: "#1", tag: "NEW", class: "cover-asm", desc: "The legendary return of Peter Parker.", color: "#8b0000" },
    { title: "Miles Morales", issue: "#24", tag: "HOT", class: "cover-miles", desc: "Brooklyn's Spider-Man faces the Prowler.", color: "#001a4d" },
    { title: "Spider-Gwen", issue: "#08", tag: "NEW", class: "cover-gwen", desc: "Ghost-Spider swings through Earth-65.", color: "#1a1a2e" },
    { title: "Spider-Man 2099", issue: "#01", tag: "CLASSIC", class: "cover-2099", desc: "Miguel O'Hara in the neon future.", color: "#002233" },
    { title: "Superior Spider-Man", issue: "#15", tag: "HOT", class: "cover-asm", desc: "Doctor Octopus takes control.", color: "#222" },
    { title: "Ultimate Spider-Man", issue: "#1", tag: "CLASSIC", class: "cover-miles", desc: "The story that started it all.", color: "#440000" },
    { title: "Spider-Punk", issue: "#01", tag: "NEW", class: "cover-gwen", desc: "Anarchy in the Spider-Verse.", color: "#000" },
    { title: "Spider-Noir", issue: "#04", tag: "CLASSIC", class: "cover-2099", desc: "Eyes in the shadows of 1933.", color: "#111" }
  ];

  // 2. FUNCTION: RENDER COMICS
  function renderComics(data) {
    const grid = document.getElementById('comicGrid');
    grid.innerHTML = ''; 

    data.forEach(comic => {
      const card = document.createElement('div');
      card.className = 'comic-card';
      card.innerHTML = `
        <div class="comic-cover-placeholder" style="background: linear-gradient(135deg, ${comic.color}, #000)">
          <div class="comic-badge ${comic.tag.toLowerCase()}">${comic.tag}</div>
        </div>
        <div class="comic-info">
          <div class="comic-issue">ISSUE ${comic.issue}</div>
          <div class="comic-title">${comic.title}</div>
          <div class="comic-desc">${comic.desc}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // 3. FUNCTION: SEARCH FILTER
  function filterComics() {
    const term = document.getElementById('comicSearch').value.toLowerCase();
    const filtered = comicDatabase.filter(c => 
      c.title.toLowerCase().includes(term) || 
      c.desc.toLowerCase().includes(term)
    );

    if (filtered.length === 0) {
      document.getElementById('comicGrid').innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">
          <h2 style="font-family: 'Bangers'; color: var(--red); font-size: 2.5rem;">UNIVERSE NOT FOUND</h2>
          <p style="color: #666;">No spiders matching "${term}" were found in this reality.</p>
        </div>`;
    } else {
      renderComics(filtered);
    }
  }

  // INITIAL LOAD
  window.onload = () => {
    renderComics(comicDatabase);
  };
</script>
</body>
</html>
