<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist – Web-Slinger Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Boogaloo&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red: #E8001C;
            --blue: #1565C0;
            --yellow: #FFD700;
            --white: #F5F5F5;
            --black: #0A0A0A;
            --mid: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255, 255, 255, .03) 1px, transparent 1px);
            background-size: 18px 18px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 36px 20px 20px;
            background: linear-gradient(180deg, #1a0000 0%, var(--black) 100%);
            border-bottom: 3px solid var(--red);
        }

        .logo {
            font-family: 'Boogaloo', cursive;
            font-size: clamp(2.5rem, 8vw, 6rem);
            color: var(--red);
            letter-spacing: 4px;
            line-height: 1;
            text-shadow: 4px 4px 0 #000, 0 0 40px rgba(232, 0, 28, .5);
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {

            0%,
            95% {
                opacity: 1
            }

            96% {
                opacity: .85
            }

            97% {
                opacity: 1
            }

            98% {
                opacity: .9
            }

            100% {
                opacity: 1
            }
        }

        .tagline {
            font-size: clamp(.7rem, 2vw, 1rem);
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--white);
            margin-top: 4px;
            opacity: .7;
        }

        .account-widget {
            position: absolute;
            top: 18px;
            right: 20px;
            z-index: 50;
        }

        .account-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            background: rgba(10, 10, 10, .85);
            border: 1.5px solid var(--red);
            padding: 7px 14px 7px 8px;
            cursor: pointer;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            transition: all .2s;
        }

        .account-btn:hover {
            background: rgba(232, 0, 28, .15);
            border-color: var(--yellow);
        }

        .account-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            color: #fff;
            border: 1.5px solid var(--yellow);
            flex-shrink: 0;
        }

        .account-name {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--white);
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111;
            border: 1.5px solid var(--red);
            min-width: 170px;
            display: none;
            flex-direction: column;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
            z-index: 200;
        }

        .account-dropdown.open {
            display: flex;
        }

        .dropdown-email {
            padding: 10px 14px;
            font-size: .75rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, .35);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-item {
            padding: 11px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
            cursor: pointer;
            transition: background .2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, .06);
        }

        .dropdown-item.logout {
            color: var(--red);
        }

        .login-link-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 10, .85);
            border: 1.5px solid rgba(255, 255, 255, .2);
            padding: 8px 16px;
            cursor: pointer;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            transition: all .2s;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
        }

        .login-link-btn:hover {
            background: var(--red);
            border-color: var(--red);
        }

        nav.navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, .92) !important;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--blue);
            padding: 10px 20px;
        }

        .navbar-nav {
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .nav-btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white) !important;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .15);
            padding: 8px 20px;
            cursor: pointer;
            transition: all .2s;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: var(--red) !important;
            border-color: var(--red);
            color: #fff !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 0, 28, .4);
        }

        .navbar-toggler {
            border-color: var(--red);
            filter: invert(1);
        }

        .welcome-banner {
            display: none;
            position: relative;
            z-index: 1;
            background: linear-gradient(90deg, rgba(21, 101, 192, .15), rgba(232, 0, 28, .1), rgba(21, 101, 192, .15));
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            padding: 10px 20px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
        }

        .welcome-banner span {
            color: var(--yellow);
        }

        .wishlist-nav-count {
            display: inline-block;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: .65rem;
            text-align: center;
            line-height: 18px;
            margin-left: 4px;
        }

        /* PAGE HEADER */
        .page-hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 56px 20px 40px;
            background: radial-gradient(ellipse at 50% 0%, rgba(232, 0, 28, .15) 0%, transparent 65%);
        }

        .section-label {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 10px;
        }

        .section-title {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            color: var(--yellow);
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, .5);
            line-height: 1;
        }

        /* TABS */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px 0;
        }

        .tab-btn {
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, .4);
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .1);
            padding: 10px 28px;
            cursor: pointer;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            transition: all .2s;
        }

        .tab-btn.active {
            color: #fff;
            background: var(--red);
            border-color: var(--red);
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
            border-color: rgba(255, 255, 255, .3);
        }

        /* LIST */
        .wl-section {
            position: relative;
            z-index: 1;
            padding: 32px 20px 64px;
        }

        .wl-count {
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .3);
            padding: 12px 0 24px;
        }

        .wl-item {
            background: #111;
            border: 2px solid rgba(255, 255, 255, .07);
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 18px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            transition: border-color .2s;
        }

        .wl-item:hover {
            border-color: var(--red);
        }

        .wl-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .wl-title {
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--yellow);
            flex: 1;
        }

        .wl-remove {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--red);
            background: transparent;
            border: 1.5px solid var(--red);
            padding: 6px 14px;
            cursor: pointer;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
            transition: all .2s;
        }

        .wl-remove:hover {
            background: var(--red);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-title {
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, .2);
            margin-bottom: 10px;
        }

        .empty-desc {
            font-size: .95rem;
            color: rgba(255, 255, 255, .3);
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .go-btn {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #000;
            background: var(--yellow);
            border: none;
            padding: 12px 36px;
            cursor: pointer;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
            text-decoration: none;
            display: inline-block;
        }

        footer {
            background: #050505;
            border-top: 3px solid var(--red);
            padding: 28px 20px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: .9rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, .3);
        }

        footer span {
            color: var(--red);
        }

        .toast-custom {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            border: 1.5px solid var(--yellow);
            color: var(--white);
            padding: 12px 28px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: .9rem;
            opacity: 0;
            transition: all .3s;
            z-index: 9999;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-custom.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <header>
        <div class="account-widget" id="accountWidget"></div>
        <div class="logo">Web-Slinger Reviews</div>
        <div class="tagline">Your #1 Spider-Man Comic Rating Destination</div>
    </header>

    <nav class="navbar navbar-expand-md">
        <div class="container-fluid justify-content-center">
            <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="index.html" class="nav-btn">Home</a></li>
                    <li class="nav-item"><a href="books.html" class="nav-btn">All Comics</a></li>
                    <li class="nav-item"><a href="wishlist.html" class="nav-btn active">Wishlist <span
                                class="wishlist-nav-count" id="wishlistCount">0</span></a></li>
                    <li class="nav-item"><a href="about.html" class="nav-btn">About</a></li>
                    <li class="nav-item"><a href="login.html" class="nav-btn" id="navAuthBtn">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="welcome-banner" id="welcomeBanner">Welcome back, <span id="welcomeName">Hero</span>!</div>

    <section class="page-hero">
        <div class="section-label">Your Collection</div>
        <div class="section-title">My Wishlist &amp; Reading Log</div>
    </section>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('wishlist',this)">♥ Want to Read</button>
        <button class="tab-btn" onclick="showTab('done',this)">✓ Already Read</button>
    </div>

    <section class="wl-section">
        <div class="container" style="max-width:700px;">

            <!-- WISHLIST TAB -->
            <div id="tabWishlist">
                <div class="wl-count" id="wlCount"></div>
                <div id="wlList"></div>
            </div>

            <!-- DONE TAB -->
            <div id="tabDone" style="display:none;">
                <div class="wl-count" id="doneCount"></div>
                <div id="doneList"></div>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 <span>Web-Slinger Reviews</span> — All Rights Reserved</p>
    </footer>
    <div class="toast-custom" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getInitials(n) { return n.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        function logout() { localStorage.removeItem('wsreviews_user'); showToast('See you around, hero!'); setTimeout(() => window.location.reload(), 1000); }

        function renderList(items, containerId, countId, type) {
            const count = document.getElementById(countId);
            const list = document.getElementById(containerId);
            count.textContent = items.length + ' Comic' + (items.length !== 1 ? 's' : '');
            if (items.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-icon">${type === 'wishlist' ? '♥' : '📖'}</div><div class="empty-title">${type === 'wishlist' ? 'Nothing here yet!' : 'No comics read yet!'}</div><div class="empty-desc">${type === 'wishlist' ? 'Head to the comics page and add books you want to read.' : 'Start reading and mark comics as done from the comics page.'}</div><a href="books.html" class="go-btn">Browse Comics</a></div>`;
                return;
            }
            list.innerHTML = items.map(item => `
    <div class="wl-item">
      <div class="wl-icon">${type === 'wishlist' ? '♥' : '✓'}</div>
      <div class="wl-title">${item.name}</div>
      <button class="wl-remove" onclick="removeItem('${item.id}','${type}')">Remove</button>
    </div>`).join('');
        }

        function removeItem(id, type) {
            const key = type === 'wishlist' ? 'ws_wishlist' : 'ws_done';
            const arr = JSON.parse(localStorage.getItem(key) || '[]');
            const idx = arr.findIndex(i => i.id === id);
            if (idx > -1) { arr.splice(idx, 1); localStorage.setItem(key, JSON.stringify(arr)); }
            renderAll(); updateWishlistCount();
            showToast(type === 'wishlist' ? '💔 Removed from wishlist' : '📚 Removed from reading log');
        }

        function renderAll() {
            const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]');
            const done = JSON.parse(localStorage.getItem('ws_done') || '[]');
            renderList(wl, 'wlList', 'wlCount', 'wishlist');
            renderList(done, 'doneList', 'doneCount', 'done');
        }

        function updateWishlistCount() { const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]'); const el = document.getElementById('wishlistCount'); if (el) el.textContent = wl.length; }

        function showTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tabWishlist').style.display = tab === 'wishlist' ? '' : 'none';
            document.getElementById('tabDone').style.display = tab === 'done' ? '' : 'none';
        }

        function renderAccount() {
            const raw = localStorage.getItem('wsreviews_user'); const widget = document.getElementById('accountWidget'); const navAuthBtn = document.getElementById('navAuthBtn'); const wb = document.getElementById('welcomeBanner');
            if (!raw) { widget.innerHTML = `<a href="login.html" class="login-link-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Login</a>`; return; }
            const user = JSON.parse(raw); wb.style.display = 'block'; document.getElementById('welcomeName').innerText = user.name.split(' ')[0]; navAuthBtn.innerText = 'My Account'; const initials = getInitials(user.name);
            widget.innerHTML = `<div class="account-btn" onclick="toggleDropdown()"><div class="account-avatar">${initials}</div><div class="account-name">${user.name.split(' ')[0]}</div><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" style="opacity:.5;flex-shrink:0;"><path d="M1 3l4 4 4-4"/></svg></div><div class="account-dropdown" id="accountDropdown"><div class="dropdown-email">${user.email}</div><a href="wishlist.html" class="dropdown-item">♥ My Wishlist</a><button class="dropdown-item logout" onclick="logout()">Log Out</button></div>`;
        }
        function toggleDropdown() { const dd = document.getElementById('accountDropdown'); if (dd) dd.classList.toggle('open'); }
        document.addEventListener('click', e => { const dd = document.getElementById('accountDropdown'); const btn = document.querySelector('.account-btn'); if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) dd.classList.remove('open'); });

        renderAccount(); renderAll(); updateWishlistCount();
    </script>
</body>

</html>
