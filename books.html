<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Comics – Web-Slinger Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bangers&family=Boogaloo&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red: #E8001C;
            --blue: #1565C0;
            --yellow: #FFD700;
            --white: #F5F5F5;
            --black: #0A0A0A;
            --mid: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255, 255, 255, .03) 1px, transparent 1px);
            background-size: 18px 18px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 36px 20px 20px;
            background: linear-gradient(180deg, #1a0000 0%, var(--black) 100%);
            border-bottom: 3px solid var(--red);
        }

        .logo {
            font-family: 'Boogaloo', cursive;
            font-size: clamp(2.5rem, 8vw, 6rem);
            color: var(--red);
            letter-spacing: 4px;
            line-height: 1;
            text-shadow: 4px 4px 0 #000, 0 0 40px rgba(232, 0, 28, .5);
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {

            0%,
            95% {
                opacity: 1
            }

            96% {
                opacity: .85
            }

            97% {
                opacity: 1
            }

            98% {
                opacity: .9
            }

            100% {
                opacity: 1
            }
        }

        .tagline {
            font-size: clamp(.7rem, 2vw, 1rem);
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--white);
            margin-top: 4px;
            opacity: .7;
        }

        .account-widget {
            position: absolute;
            top: 18px;
            right: 20px;
            z-index: 50;
        }

        .account-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            background: rgba(10, 10, 10, .85);
            border: 1.5px solid var(--red);
            padding: 7px 14px 7px 8px;
            cursor: pointer;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            transition: all .2s;
        }

        .account-btn:hover {
            background: rgba(232, 0, 28, .15);
            border-color: var(--yellow);
        }

        .account-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            color: #fff;
            border: 1.5px solid var(--yellow);
            flex-shrink: 0;
        }

        .account-name {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--white);
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111;
            border: 1.5px solid var(--red);
            min-width: 170px;
            display: none;
            flex-direction: column;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
            z-index: 200;
        }

        .account-dropdown.open {
            display: flex;
        }

        .dropdown-email {
            padding: 10px 14px;
            font-size: .75rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, .35);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-item {
            padding: 11px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
            cursor: pointer;
            transition: background .2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, .06);
        }

        .dropdown-item.logout {
            color: var(--red);
        }

        .login-link-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 10, 10, .85);
            border: 1.5px solid rgba(255, 255, 255, .2);
            padding: 8px 16px;
            cursor: pointer;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            transition: all .2s;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white);
        }

        .login-link-btn:hover {
            background: var(--red);
            border-color: var(--red);
        }

        nav.navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, .92) !important;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--blue);
            padding: 10px 20px;
        }

        .navbar-nav {
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .nav-btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--white) !important;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .15);
            padding: 8px 20px;
            cursor: pointer;
            transition: all .2s;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: var(--red) !important;
            border-color: var(--red);
            color: #fff !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(232, 0, 28, .4);
        }

        .navbar-toggler {
            border-color: var(--red);
            filter: invert(1);
        }

        .welcome-banner {
            display: none;
            position: relative;
            z-index: 1;
            background: linear-gradient(90deg, rgba(21, 101, 192, .15), rgba(232, 0, 28, .1), rgba(21, 101, 192, .15));
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            padding: 10px 20px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
        }

        .welcome-banner span {
            color: var(--yellow);
        }

        .wishlist-nav-count {
            display: inline-block;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: .65rem;
            text-align: center;
            line-height: 18px;
            margin-left: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        /* LIBRARY HEADER */
        .library-header {
            position: relative;
            z-index: 1;
            padding: 48px 20px 32px;
            text-align: center;
            background: radial-gradient(ellipse at 50% 0%, rgba(232, 0, 28, .15) 0%, transparent 65%);
        }

        .section-label {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 10px;
        }

        .section-title {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            color: var(--yellow);
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, .5);
            line-height: 1;
        }

        /* FILTER */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .filter-btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .15);
            padding: 7px 18px;
            cursor: pointer;
            clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
            transition: all .2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: #fff;
            background: var(--red);
            border-color: var(--red);
        }

        .grid-count {
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: .8rem;
            color: rgba(255, 255, 255, .3);
            text-transform: uppercase;
            padding-bottom: 24px;
        }

        /* COMIC CARDS */
        .comic-card {
            position: relative;
            background: #111;
            border: 2px solid rgba(255, 255, 255, .08);
            cursor: pointer;
            transition: all .25s ease, opacity .6s ease, transform .6s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
            overflow: hidden;
            text-decoration: none;
            display: block;
            opacity: 0;
            transform: translateY(30px);
        }

        .comic-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .comic-card:hover {
            border-color: var(--red);
            transform: translateY(-6px) !important;
            box-shadow: 0 12px 40px rgba(232, 0, 28, .3), 6px 6px 0 var(--blue);
        }

        .comic-card:hover .comic-overlay {
            opacity: 1;
        }

        .comic-cover-placeholder {
            width: 100%;
            aspect-ratio: 2/3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .cover-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        .comic-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, .95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 14px;
            gap: 8px;
            opacity: 0;
            transition: opacity .25s;
        }

        .overlay-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .overlay-btn {
            font-family: 'Bebas Neue', cursive;
            font-size: .8rem;
            letter-spacing: 2px;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
            transition: background .2s;
            color: #000;
            background: var(--yellow);
        }

        .overlay-btn:hover {
            background: #fff;
        }

        .overlay-btn.wishlist-btn {
            background: rgba(255, 255, 255, .15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .3);
        }

        .overlay-btn.wishlist-btn:hover {
            background: var(--red);
        }

        .overlay-btn.done-btn {
            background: rgba(0, 200, 100, .2);
            color: #0f0;
            border: 1px solid rgba(0, 200, 100, .4);
        }

        .overlay-btn.done-btn:hover {
            background: rgba(0, 200, 100, .5);
        }

        .star-row {
            display: flex;
            justify-content: center;
            gap: 2px;
        }

        .star {
            font-size: 1rem;
            cursor: pointer;
            color: rgba(255, 255, 255, .2);
            transition: color .15s;
            line-height: 1;
        }

        .star.lit,
        .star:hover {
            color: var(--yellow);
        }

        .star-row:hover .star {
            color: var(--yellow);
        }

        .star-row .star:hover~.star {
            color: rgba(255, 255, 255, .2);
        }

        .comic-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: 'Bangers', cursive;
            font-size: .8rem;
            letter-spacing: 2px;
            padding: 3px 10px;
            background: var(--red);
            color: #fff;
            clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
            z-index: 5;
        }

        .comic-badge.new {
            background: var(--blue);
        }

        .comic-badge.classic {
            background: #333;
        }

        .wishlist-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.1rem;
            z-index: 6;
            display: none;
            color: var(--red);
        }

        .wishlist-badge.show {
            display: block;
        }

        .done-badge {
            position: absolute;
            top: 32px;
            right: 10px;
            font-size: 1.1rem;
            z-index: 6;
            display: none;
            color: #0f0;
        }

        .done-badge.show {
            display: block;
        }

        .comic-info {
            padding: 10px 12px 14px;
        }

        .comic-title {
            font-family: 'Bangers', cursive;
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: var(--yellow);
        }

        .comic-desc {
            font-size: .78rem;
            color: rgba(255, 255, 255, .4);
            letter-spacing: .5px;
            margin-top: 3px;
            line-height: 1.4;
        }

        .comic-rating-display {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            font-size: .78rem;
            color: var(--yellow);
        }

        footer {
            background: #050505;
            border-top: 3px solid var(--red);
            padding: 28px 20px;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: .9rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, .3);
        }

        footer span {
            color: var(--red);
        }

        .toast-custom {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            border: 1.5px solid var(--yellow);
            color: var(--white);
            padding: 12px 28px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: .9rem;
            opacity: 0;
            transition: all .3s;
            z-index: 9999;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-custom.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── FLASHCARD FLIP ── */
        .comic-card-wrapper {
            perspective: 1000px;
            height: 100%;
        }

        .comic-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(.4, 0, .2, 1);
            transform-style: preserve-3d;
        }

        .comic-card-wrapper.flipped .comic-card-inner {
            transform: rotateY(180deg);
        }

        .comic-card,
        .comic-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .comic-card {
            position: relative;
        }

        .comic-card-back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
            background: #111;
            border: 2px solid var(--red);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 14px;
            gap: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s 0.25s;
        }

        .comic-card-wrapper.flipped .comic-card-back {
            opacity: 1;
        }

        .back-title {
            font-family: 'Bangers', cursive;
            font-size: 1.3rem;
            letter-spacing: 3px;
            color: var(--yellow);
            line-height: 1.1;
        }

        .back-issue {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: .7rem;
            letter-spacing: 3px;
            color: var(--red);
            text-transform: uppercase;
        }

        .back-desc {
            font-size: .8rem;
            color: rgba(255, 255, 255, .6);
            line-height: 1.5;
            letter-spacing: .3px;
        }

        .back-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }

        .back-divider {
            width: 40px;
            height: 2px;
            background: var(--red);
            margin: 2px auto;
        }

        .flip-hint {
            position: absolute;
            bottom: 8px;
            right: 10px;
            font-size: .6rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, .25);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="account-widget" id="accountWidget"></div>
        <div class="logo">Web-Slinger Reviews</div>
        <div class="tagline">Your #1 Spider-Man Comic Rating Destination</div>
    </header>

    <nav class="navbar navbar-expand-md">
        <div class="container-fluid justify-content-center">
            <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="mainNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="index.html" class="nav-btn">Home</a></li>

        <div class="section-title">All Spider-Man Comics</div>
    </section>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterComics('all',this)">All</button>

    <div class="grid-count" id="gridCount">24 Comics</div>

    <div class="container pb-5">
        <div class="row g-3" id="comicsGrid">

        </div>
    </div>

    <footer>
        <p>© 2026 <span>Web-Slinger Reviews</span> — All Rights Reserved</p>
    </footer>
    <div class="toast-custom" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const COMICS = [

            { id: 'asm1', cat: 'classic', badge: 'CLASSIC', badgeCls: 'classic', title: 'The Amazing Spider-Man #1', desc: 'Peter goes solo. The Chameleon and the Fantastic Four make their appearances.', img: 'https://upload.wikimedia.org/wikipedia/en/7/70/AmazingSpiderMan1.jpg', defaultRating: 5, svgBg: '#1a0000', svgText: 'AMAZING SPIDER-MAN #1' },
            { id: 'asm33', cat: 'classic', badge: 'CLASSIC', badgeCls: 'classic', title: 'Amazing Spider-Man #33', desc: 'The iconic "If This Be My Destiny" — Peter lifts machinery from sheer will.', img: 'https://upload.wikimedia.org/wikipedia/en/3/3b/AmazingSpiderMan33.jpg', defaultRating: 5, svgBg: '#100000', svgText: 'AMAZING SPIDER-MAN #33' },

            if (designer) return designer(comic);
            // Generic fallback for any future comics
            const hue = Math.abs(comic.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0)) % 360;
            return `<svg viewBox="0 0 200 300" class="cover-svg" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="300" fill="${comic.svgBg || '#111'}"/><circle cx="100" cy="110" r="55" fill="none" stroke="hsl(${hue},70%,40%)" stroke-width="2" opacity="0.5"/><ellipse cx="100" cy="110" rx="25" ry="32" fill="${comic.svgBg || '#111'}" stroke="hsl(${hue},70%,50%)" stroke-width="2"/><ellipse cx="87" cy="99" rx="10" ry="7" fill="white"/><ellipse cx="113" cy="99" rx="10" ry="7" fill="white"/><text x="100" y="215" text-anchor="middle" font-family="Bangers,cursive" font-size="13" fill="#FFD700" letter-spacing="1">${comic.svgText.substring(0, 22)}</text></svg>`;
        }

        function buildCard(comic) {
            const ratingStars = '★'.repeat(comic.defaultRating) + '☆'.repeat(5 - comic.defaultRating);
            const imgTag = comic.img ? `<img class="cover-img" src="${comic.img}" alt="${comic.title}" onerror="this.style.display='none'">` : '';
            const safeTitle = comic.title.replace(/'/g, "\\'");
            return `
  <div class="col-6 col-sm-4 col-md-3" data-category="${comic.cat}" data-id="${comic.id}" style="min-height:420px;">
    <div class="comic-card-wrapper" id="wrapper-${comic.id}" onclick="flipCard('${comic.id}')">
      <div class="comic-card-inner">

        <!-- FRONT -->
        <div class="comic-card" id="card-${comic.id}" style="height:100%;">
          <div class="comic-cover-placeholder" style="background:${comic.svgBg || '#111'};">
            ${imgTag}
            ${svgFallback(comic)}
            <div class="comic-overlay">
              <div class="overlay-actions">
                <button class="overlay-btn wishlist-btn" onclick="toggleWishlist(event,'${comic.id}','${safeTitle}')">♥ Wishlist</button>
                <button class="overlay-btn done-btn" onclick="toggleDone(event,'${comic.id}','${safeTitle}')">✓ Read</button>
              </div>
              <div class="star-row" data-id="${comic.id}">
                <span class="star" onclick="rateComic(event,'${comic.id}',1)">★</span>
                <span class="star" onclick="rateComic(event,'${comic.id}',2)">★</span>
                <span class="star" onclick="rateComic(event,'${comic.id}',3)">★</span>
                <span class="star" onclick="rateComic(event,'${comic.id}',4)">★</span>
                <span class="star" onclick="rateComic(event,'${comic.id}',5)">★</span>
              </div>
            </div>
          </div>
          <div class="comic-badge ${comic.badgeCls}">${comic.badge}</div>
          <div class="wishlist-badge" id="wish-${comic.id}">♥</div>
          <div class="done-badge" id="done-${comic.id}">✓</div>
          <div class="comic-info">
            <div class="comic-title">${comic.title}</div>
            <div class="comic-desc">${comic.desc}</div>
            <div class="comic-rating-display">
              <span id="disp-${comic.id}">${ratingStars}</span>
              <span id="dispval-${comic.id}">${comic.defaultRating}.0</span>
            </div>
          </div>
          <div class="flip-hint">tap to flip ↩</div>
        </div>

        <!-- BACK (Flashcard) -->
        <div class="comic-card-back">
          <div class="back-issue">${comic.badge} · ${comic.cat.toUpperCase()}</div>
          <div class="back-title">${comic.title}</div>
          <div class="back-divider"></div>
          <div class="back-desc">${comic.desc}</div>
          <div class="back-actions">
            <button class="overlay-btn wishlist-btn" onclick="toggleWishlist(event,'${comic.id}','${safeTitle}')">♥ Wishlist</button>
            <button class="overlay-btn done-btn" onclick="toggleDone(event,'${comic.id}','${safeTitle}')">✓ Read</button>
          </div>
          <div class="star-row" data-id="${comic.id}-back">
            <span class="star" onclick="rateComic(event,'${comic.id}',1)">★</span>
            <span class="star" onclick="rateComic(event,'${comic.id}',2)">★</span>
            <span class="star" onclick="rateComic(event,'${comic.id}',3)">★</span>
            <span class="star" onclick="rateComic(event,'${comic.id}',4)">★</span>
            <span class="star" onclick="rateComic(event,'${comic.id}',5)">★</span>
          </div>
          <div class="flip-hint">tap to flip ↩</div>
        </div>

      </div>
    </div>
  </div>`;
        }

        function flipCard(id) {
            const wrapper = document.getElementById('wrapper-' + id);
            if (wrapper) wrapper.classList.toggle('flipped');
        }

        function renderGrid() {
            const grid = document.getElementById('comicsGrid');
            grid.innerHTML = COMICS.map(buildCard).join('');
            document.getElementById('gridCount').innerText = COMICS.length + ' Comics';
            loadRatings(); updateBadges(); updateWishlistCount();
            const observer = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) { e.target.querySelector('.comic-card').classList.add('visible'); observer.unobserve(e.target); } }); }, { threshold: .1 });
            document.querySelectorAll('.comic-card-wrapper').forEach((c, i) => { c.style.transitionDelay = (i * .05) + 's'; observer.observe(c); });
        }

        function filterComics(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cols = document.querySelectorAll('#comicsGrid > [data-category]');
            let count = 0;
            const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]');
            const done = JSON.parse(localStorage.getItem('ws_done') || '[]');
            cols.forEach(col => {
                const id = col.dataset.id;
                let show = category === 'all' || col.dataset.category === category;
                if (category === 'wishlist') show = wl.some(i => i.id === id);
                if (category === 'done') show = done.some(i => i.id === id);
                col.style.display = show ? '' : 'none';
                if (show) { count++; const card = col.querySelector('.comic-card'); if (card) card.classList.add('visible'); }
            });
            document.getElementById('gridCount').innerText = count + ' Comic' + (count !== 1 ? 's' : '');
        }

        function rateComic(e, id, stars) {
            e.stopPropagation(); e.preventDefault();
            const ratings = JSON.parse(localStorage.getItem('ws_ratings') || '{}');
            ratings[id] = stars; localStorage.setItem('ws_ratings', JSON.stringify(ratings));
            updateStarDisplay(id, stars);
            const comic = COMICS.find(c => c.id === id);
            showToast('⭐ Rated ' + stars + '/5 for ' + (comic ? comic.title : id) + '!');
        }
        function updateStarDisplay(id, stars) {
            const row = document.querySelector(`.star-row[data-id="${id}"]`);
            if (row) row.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('lit', i < stars));
            const d = document.getElementById('disp-' + id); const dv = document.getElementById('dispval-' + id);
            if (d) d.textContent = '★'.repeat(stars) + '☆'.repeat(5 - stars);
            if (dv) dv.textContent = stars + '.0';
        }
        function loadRatings() {
            const ratings = JSON.parse(localStorage.getItem('ws_ratings') || '{}');
            Object.entries(ratings).forEach(([id, stars]) => updateStarDisplay(id, stars));
        }

        function toggleWishlist(e, id, name) {
            e.stopPropagation(); e.preventDefault();
            const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]');
            const idx = wl.findIndex(i => i.id === id);
            if (idx > -1) { wl.splice(idx, 1); showToast('💔 Removed from Wishlist'); }
            else { wl.push({ id, name }); showToast('♥ Added to Wishlist!'); }
            localStorage.setItem('ws_wishlist', JSON.stringify(wl));
            updateBadges(); updateWishlistCount();
        }
        function toggleDone(e, id, name) {
            e.stopPropagation(); e.preventDefault();
            const done = JSON.parse(localStorage.getItem('ws_done') || '[]');
            const idx = done.findIndex(i => i.id === id);
            if (idx > -1) { done.splice(idx, 1); showToast('📚 Marked as unread'); }
            else { done.push({ id, name }); showToast('✅ Marked as Read!'); }
            localStorage.setItem('ws_done', JSON.stringify(done));
            updateBadges();
        }
        function updateBadges() {
            const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]');
            const done = JSON.parse(localStorage.getItem('ws_done') || '[]');
            document.querySelectorAll('.wishlist-badge').forEach(el => { const id = el.id.replace('wish-', ''); el.classList.toggle('show', wl.some(i => i.id === id)); });
            document.querySelectorAll('.done-badge').forEach(el => { const id = el.id.replace('done-', ''); el.classList.toggle('show', done.some(i => i.id === id)); });
        }
        function updateWishlistCount() { const wl = JSON.parse(localStorage.getItem('ws_wishlist') || '[]'); const el = document.getElementById('wishlistCount'); if (el) el.textContent = wl.length; }

        function getInitials(name) { return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        function logout() { localStorage.removeItem('wsreviews_user'); showToast('See you around, hero!'); setTimeout(() => window.location.reload(), 1000); }
        function renderAccount() {
            const raw = localStorage.getItem('wsreviews_user'); const widget = document.getElementById('accountWidget'); const navAuthBtn = document.getElementById('navAuthBtn'); const wb = document.getElementById('welcomeBanner');
            if (!raw) { widget.innerHTML = `<a href="login.html" class="login-link-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Login</a>`; return; }
            const user = JSON.parse(raw); wb.style.display = 'block'; document.getElementById('welcomeName').innerText = user.name.split(' ')[0]; navAuthBtn.innerText = 'My Account'; const initials = getInitials(user.name);
            widget.innerHTML = `<div class="account-btn" onclick="toggleDropdown()"><div class="account-avatar">${initials}</div><div class="account-name">${user.name.split(' ')[0]}</div><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" style="opacity:.5;flex-shrink:0;"><path d="M1 3l4 4 4-4"/></svg></div><div class="account-dropdown" id="accountDropdown"><div class="dropdown-email">${user.email}</div><a href="wishlist.html" class="dropdown-item">♥ My Wishlist</a><button class="dropdown-item logout" onclick="logout()">Log Out</button></div>`;
        }
        function toggleDropdown() { const dd = document.getElementById('accountDropdown'); if (dd) dd.classList.toggle('open'); }
        document.addEventListener('click', e => { const dd = document.getElementById('accountDropdown'); const btn = document.querySelector('.account-btn'); if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) dd.classList.remove('open'); });

        renderGrid();
        renderAccount();
    </script>
</body>

</html>
